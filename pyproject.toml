[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbsn"
version = "0.1.0"
description = "Harmonic Beltrami Signature Network — training & evaluation codebase"
requires-python = ">=3.12,<3.13"  # 固定 3.12：golden 数值测试与多 venv 一致
# 精确钉版：maskrcnn/deeplab 手抄 torchvision 内部 API，smp 0.3.3 与 unetpp checkpoint 的
# state_dict 键绑定，跨版本升级会静默换键
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "segmentation-models-pytorch==0.3.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "tensorboard>=2.16",
    # 下限为 numpy 2 兼容版本（3.7.1 / 4.8.x 是 numpy 1.x 时代编译，import 即崩）
    "matplotlib>=3.8",
    "Pillow>=10",
    "opencv-python>=4.10",
    "pycocotools>=2.0.7",
    "hbs==1.0.1",
]

[project.optional-dependencies]
# click 仅 tools/build_image.py 用（离线数据生成 CLI），不属于主包运行依赖
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "click>=8"]

[project.scripts]
hbsn-train = "hbsn.train:main"

[tool.hatch.build.targets.wheel]
packages = ["hbsn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 覆盖门禁：hbsn 包 ≥80%；缺失行在 term-missing 里列出
addopts = "--cov=hbsn --cov-report=term-missing --cov-fail-under=80"
