[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbsn"
version = "0.1.0"
description = "Harmonic Beltrami Signature Network — training & evaluation codebase"
requires-python = ">=3.10"
# 精确钉版：maskrcnn/deeplab 手抄 torchvision 内部 API，smp 0.3.3 与 unetpp checkpoint 的
# state_dict 键绑定，跨版本升级会静默换键
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "segmentation-models-pytorch==0.3.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "tensorboard>=2.16",
    # 下限为 numpy 2 兼容版本（3.7.1 / 4.8.x 是 numpy 1.x 时代编译，import 即崩）
    "matplotlib>=3.8",
    "Pillow>=10",
    "opencv-python>=4.10",
    "pycocotools>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hbsn-train = "hbsn.train:main"

[tool.hatch.build.targets.wheel]
packages = ["hbsn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
