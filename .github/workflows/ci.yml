name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: "Install deps (incl. dev extras: pytest/ruff)"
        run: uv sync --extra dev
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Test (hermetic — 合成数据，coco 数据依赖测试自动 skip)
        run: uv run --extra dev python -m pytest -q --cov=hbsn --cov-fail-under=80
